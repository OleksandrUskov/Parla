# XcodeGen spec for the Parla iOS app (iOS-port P1.4).
#
# ADDITIVE: the macOS app stays a pure SwiftPM build (`build_app.sh`); this only stands up the NEW iOS app
# target on top of the same cross-platform `ParlaCore` package (referenced as a local package at `../..`).
#
# The generated `Parla-iOS.xcodeproj` is a BUILD ARTIFACT (gitignored) — regenerate anytime with:
#     cd apps/ios && xcodegen generate
# `project.yml` (this file) is the checked-in source of truth for the project structure. Nothing here is
# "throwaway": the Swift sources under `Sources/` + the linked `ParlaCore` are the real, permanent app.
name: Parla-iOS
options:
  bundleIdPrefix: com.parla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ParlaCore:
    path: ../..
  # In-process Ogg/Opus decode (iOS-port P1.3, IOS_PORT §2). BSD, SPM .binaryTarget, iOS 15+, self-contained
  # (bundles libopus + Opusfile + libogg). Replaces the macOS ffmpeg subprocess (dead on iOS) for Telegram voice.
  opus:
    url: https://github.com/sbooth/opus-binary-xcframework
    from: "0.3.0"
  # Companion to opus: Opusfile's headers `#include <ogg/ogg.h>`, which live in this separate xcframework
  # (opus-binary-xcframework does NOT vendor libogg's headers). Both are required for the Ogg/Opus file API.
  ogg:
    url: https://github.com/sbooth/ogg-binary-xcframework
    from: "0.1.3"
targets:
  Parla-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # Files compiled into BOTH the app and the ParlaWidgets extension (target membership) — the Live Activity
      # attributes etc. — so they must stay ParlaCore-free (the extension can't link ParlaCore). (P2.3b)
      - path: Shared
      # Bundle the in-app localization catalogues as folder references so `<lang>.lproj` lands at the app's
      # resource root, where Localization.swift resolves it via `Bundle.main.path(forResource:ofType:"lproj")`.
      # (macOS build_app.sh copies these in; the iOS target must do it here or every L() returns the raw key.)
      - path: ../../Localization/en.lproj
        type: folder
        buildPhase: resources
      - path: ../../Localization/ru.lproj
        type: folder
        buildPhase: resources
      - path: ../../Localization/uk.lproj
        type: folder
        buildPhase: resources
    dependencies:
      - package: ParlaCore
        product: ParlaCore
      - package: opus
        product: opus
      - package: ogg
        product: ogg
      # Embed the Share Extension into the app bundle (P1.4j). XcodeGen auto-embeds app-extension dependencies.
      - target: ParlaShareExtension
      # Embed the Widget Extension (Live Activity now, Home widget + Control in P2.3c). (P2.3b)
      - target: ParlaWidgets
    # App Group: the shared container the Share Extension (P1.4j) copies incoming voice notes into, and the app
    # drains on foreground. Generated from here by XcodeGen (the .entitlements is a gitignored build artifact).
    entitlements:
      path: Parla-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parla.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parla.ios
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        SWIFT_VERSION: "5.0"                     # spike: app-target sources in Swift-5 mode (ParlaCore stays .v6)
        # Hand-written Info.plist (like the Share Extension) — needed for CFBundleURLTypes (parla:// scheme, P2.3a)
        # and the coming NSSupportsLiveActivities / NSUserActivityTypes (P2.3b/d) that aren't scalar INFOPLIST_KEY_*.
        INFOPLIST_FILE: Parla-iOS-Info.plist
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # Share Extension (iOS-port P1.4j) — copy-only: shows Parla in the share sheet for audio/video, copies the file
  # into the App Group inbox, completes. LEAN: no ParlaCore/opus/ogg link (extension memory budget), only UIKit.
  # The end-to-end share is device-only (needs the provisioned App Group + a real share sheet).
  ParlaShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/Share
    entitlements:
      path: ParlaShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parla.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parla.ios.share
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Extensions/Share/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # Widget Extension (iOS-port P2.3b) — the transcription Live Activity / Dynamic Island now; the Home widget +
  # iOS-18 Control land in P2.3c. LEAN: NO ParlaCore/opus/ogg link (extension memory budget), only WidgetKit +
  # ActivityKit + SwiftUI + the Foundation-only Shared/ files. The App Group is ready for the P2.3c widget snapshot;
  # under CODE_SIGNING_ALLOWED=NO it's an inert no-op on the sim (same as the Share Extension).
  ParlaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/Widgets
      - path: Shared
    entitlements:
      path: ParlaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parla.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parla.ios.widgets
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: Extensions/Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
  # P1.3 runtime proof: a unit-test target (hosted by Parla-iOS) that decodes a real Ogg/Opus fixture on the
  # simulator to prove the Opusfile path works at runtime. `@testable import Parla_iOS` reuses OpusAudioDecoder.
  # The fixture is gitignored (voice never in git); the test XCTSkips when it's absent → never a false red.
  Parla-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: Parla-iOS
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Parla-iOS:
    build:
      targets:
        Parla-iOS: all
    test:
      targets:
        - Parla-iOSTests
