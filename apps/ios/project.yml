# XcodeGen spec for the Parla iOS app.
#
# ADDITIVE: the macOS app stays a pure SwiftPM build (`build_app.sh`); this only stands up the NEW iOS app
# target on top of the same cross-platform `ParlaCore` package (referenced as a local package at `../..`).
#
# The generated `Parla-iOS.xcodeproj` is a BUILD ARTIFACT (gitignored) — regenerate anytime with:
#     cd apps/ios && xcodegen generate
#     mkdir -p Parla-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
#     cp Package.resolved Parla-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
# `project.yml` (this file) is the checked-in source of truth for the project structure. Nothing here is
# "throwaway": the Swift sources under `Sources/` + the linked `ParlaCore` are the real, permanent app.
#
# ⚠️ That second command is not optional. This project resolves its packages through the GENERATED project,
# not through the root Swift package, so the root `Package.resolved` does not govern it — verified by seeding a
# different version here and watching xcodebuild check that version out. Xcode never writes a resolved file for
# a project shaped like this one, so `apps/ios/Package.resolved` is maintained BY HAND as a copy of the root
# file, and copied in after every generate (the .xcodeproj is gitignored, so it cannot live inside it).
# Without the copy, every clean machine and every CI run resolves the whole graph fresh from open-ended ranges:
# `from: "0.9.0"` on WhisperKit means anything below 1.0, so the day argmax tags 0.19 the iOS build silently
# uses a different WhisperKit than the macOS jobs, from the same commit.
# REFRESH DISCIPLINE: bumping any requirement in the root `Package.swift` or in `packages:` below means
# refreshing BOTH resolved files in the SAME commit. A test (`testTheIOSDependencySeedMatchesTheRootResolve`)
# fails if they drift, because a stale seed is worse than no seed — it looks pinned.
name: Parla-iOS
options:
  bundleIdPrefix: com.parla
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ParlaCore:
    path: ../..
  # In-process Ogg/Opus decode. BSD, SPM .binaryTarget, iOS 15+, self-contained
  # (bundles libopus + Opusfile + libogg). Replaces the macOS ffmpeg subprocess (dead on iOS) for Telegram voice.
  opus:
    url: https://github.com/sbooth/opus-binary-xcframework
    from: "0.3.0"
  # Companion to opus: Opusfile's headers `#include <ogg/ogg.h>`, which live in this separate xcframework
  # (opus-binary-xcframework does NOT vendor libogg's headers). Both are required for the Ogg/Opus file API.
  ogg:
    url: https://github.com/sbooth/ogg-binary-xcframework
    from: "0.1.3"
targets:
  Parla-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      # Files compiled into BOTH the app and the ParlaWidgets extension (target membership) — the Live Activity
      # attributes etc. — so they must stay ParlaCore-free (the extension can't link ParlaCore).
      - path: Shared
      # App icon (concept B — gradient waveform on Parla's near-black canvas). Single-size 1024² appiconset;
      # Xcode downsamples the rest. Master SVG lives at repo-root assets/icon/ (reproducible; seeds README hero).
      - path: Assets.xcassets
      # Apple Privacy Manifest (App Store required). No tracking, no data collection, one required-reason API
      # (UserDefaults / CA92.1 — app-private prefs). Audited against ParlaCore + apps/ios.
      # The two extensions carry their own PrivacyInfo.xcprivacy inside their Extensions/{Share,Widgets} folders.
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
      # Bundle the in-app localization catalogues as folder references so `<lang>.lproj` lands at the app's
      # resource root, where Localization.swift resolves it via `Bundle.main.path(forResource:ofType:"lproj")`.
      # (macOS build_app.sh copies these in; the iOS target must do it here or every L() returns the raw key.)
      - path: ../../Localization/en.lproj
        type: folder
        buildPhase: resources
      - path: ../../Localization/ru.lproj
        type: folder
        buildPhase: resources
      - path: ../../Localization/uk.lproj
        type: folder
        buildPhase: resources
    dependencies:
      - package: ParlaCore
        product: ParlaCore
      - package: opus
        product: opus
      - package: ogg
        product: ogg
      # Embed the Share Extension into the app bundle. XcodeGen auto-embeds app-extension dependencies.
      - target: ParlaShareExtension
      # Embed the Widget Extension (Live Activity now, Home widget + Control).
      - target: ParlaWidgets
    # App Group: the shared container the Share Extension copies incoming voice notes into, and the app
    # drains on foreground. Generated from here by XcodeGen (the .entitlements is a gitignored build artifact).
    entitlements:
      path: Parla-iOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parla.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parla.ios
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        SWIFT_VERSION: "6.0"
        # Hand-written Info.plist (like the Share Extension) — needed for CFBundleURLTypes (parla:// scheme)
        # and the coming NSSupportsLiveActivities / NSUserActivityTypes that aren't scalar INFOPLIST_KEY_*.
        INFOPLIST_FILE: Parla-iOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon     # matches Assets.xcassets/AppIcon.appiconset
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  # Share Extension — copy-only: shows Parla in the share sheet for audio/video, copies the file
  # into the App Group inbox, completes. LEAN: no ParlaCore/opus/ogg link (extension memory budget), only UIKit.
  # The end-to-end share is device-only (needs the provisioned App Group + a real share sheet).
  ParlaShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/Share
    entitlements:
      path: ParlaShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parla.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parla.ios.share
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Extensions/Share/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  # Widget Extension — the transcription Live Activity / Dynamic Island now; the Home widget +
  # iOS-18 Control land later. LEAN: NO ParlaCore/opus/ogg link (extension memory budget), only WidgetKit +
  # ActivityKit + SwiftUI + the Foundation-only Shared/ files. The App Group is ready for the widget snapshot;
  # under CODE_SIGNING_ALLOWED=NO it's an inert no-op on the sim (same as the Share Extension).
  ParlaWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Extensions/Widgets
      - path: Shared
    entitlements:
      path: ParlaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.parla.ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parla.ios.widgets
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Extensions/Widgets/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  # Runtime proof: a unit-test target (hosted by Parla-iOS) that decodes a real Ogg/Opus fixture on the
  # simulator to prove the Opusfile path works at runtime. `@testable import Parla_iOS` reuses OpusAudioDecoder.
  # A real voice fixture stays gitignored (voice never in git) — the committed synthetic tone below is what makes
  # the decode proof run everywhere, including CI.
  Parla-iOSTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
      # Lane-2 (AVAssetReader) decode proof lives in the SHARED suite so plain `swift test` runs it in CI on every
      # push; compiled into the iOS test target as well, because Lane 2 is the iOS-critical decode path. One file,
      # both platforms — mirrors the fat-Core/thin-app architecture.
      - path: ../../Tests/ParlaTests/AVAssetDecodeTests.swift
      # Committed 6.7 KB synthetic Ogg/Opus tone (no voice → public-repo safe). Without it the libopusfile lane was
      # proven NOWHERE automatically: the real fixture is gitignored, so CI silently skipped the decode test.
      - path: ../../Tests/ParlaTests/Fixtures/tone.ogg
        buildPhase: resources
      # The StoreKit test configuration, as a TEST-BUNDLE RESOURCE rather than a scheme attachment. The money
      # path (purchase / restore / entitlement scan) cannot be exercised from `swift test`: that runner is an
      # unhosted xctest process with no bundle identity, and StoreKit answers `notEntitled` there — measured,
      # not assumed. This target IS hosted inside the real app, which is what makes the flow reachable at all.
      # As a resource it also survives `xcodegen generate`, unlike the manual scheme attach noted below.
      - path: Parla.storekit
        buildPhase: resources
    dependencies:
      - target: Parla-iOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Parla-iOS:
    build:
      targets:
        Parla-iOS: all
    test:
      targets:
        - Parla-iOSTests
    # NOTE: to test the StoreKit purchase flow locally, attach `apps/ios/Parla.storekit` manually in Xcode
    # (Product → Scheme → Edit Scheme → Run → Options → StoreKit Configuration). Wiring it via XcodeGen's
    # `storeKitConfiguration:` emitted a wrong relative path here, so it's a one-time manual attach for now.
