name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Full build + test on macOS 26 — the environment Parla is developed and validated on. The RU
  # morphology search (NLTagger lemmas) and the FoundationModels availability floor are keyed to the
  # OS's on-device NLP/AI stack, so the suite asserts the macOS-26 behavior; earlier macOS degrades
  # gracefully at runtime (best-effort), it just isn't the test baseline.
  macos:
    name: macOS 26 · swift build + test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  # ThreadSanitizer over the same suite. The project builds every target in Swift 6 language mode (COMPLETE
  # strict concurrency), which is a COMPILE-time claim; TSan is the RUNTIME evidence for it. Cheap to keep honest:
  # verified locally at 347 tests / 0 failures / 0 race reports before this job was added.
  macos-tsan:
    name: macOS 26 · swift test (ThreadSanitizer)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test under TSan
        run: swift test --sanitize=thread

  # Compile-compatibility on the current stable Xcode (16.x / Swift 6.1). Build only — tests run on
  # macos-26 above (Apple-NLP output is OS-versioned). Guards against source that compiles only on the
  # newer toolchain (e.g. not-yet-Sendable SDK types needing @preconcurrency imports).
  macos-compat:
    name: macOS 15 · swift build (stable Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build

  # The PAID variant. `swift build` compiles the sources; it does not assemble a .app, so until this job existed
  # the entire release path — the metallib embed, the resource bundles, the opus/ogg frameworks, the ad-hoc
  # signature, the @rpath launch guard and the ParlaStoreBuild key that decides whether the app earns anything —
  # ran only on one Mac and was verified by one person's eyes. That path has already broken twice (`1607bd3`
  # dyld, `136d534` a swallowed codesign). The store flag is worse than either, because its failure mode is
  # silent: a plausible .app that gates nothing, whose first symptom is zero revenue.
  #
  # Scope, stated honestly: this job BUILDS and INSPECTS the store bundle. It does not launch a GUI app —
  # a headless runner has no dependable window server, and a check that cannot fail is worth nothing. What
  # stands in for launch is the script's own @rpath guard, which is the exact invariant the `1607bd3` dyld
  # crash violated, plus the independent bundle assertions below. Actually running it stays a local step.
  macos-store-build:
    name: macOS 26 · build_app.sh --store (the paid bundle)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the store build
        run: ./build_app.sh --store
      # Re-checked from OUTSIDE the script: a guard that only ever grades its own homework proves less.
      - name: Verify the assembled bundle
        run: |
          APP=Parla.app
          PLIST="$APP/Contents/Info.plist"
          plutil -lint "$PLIST"
          # The store flag must be a real boolean. `raw` would print "true" for a <string> too, so read the type.
          plutil -extract ParlaStoreBuild xml1 -o - "$PLIST" | grep -q '<true/>' \
            || { echo "::error::the store build does not carry ParlaStoreBuild as a boolean true"; exit 1; }
          # The pieces whose absence only bites at runtime.
          test -f "$APP/Contents/MacOS/mlx.metallib"      || { echo "::error::missing mlx.metallib"; exit 1; }
          test -d "$APP/Contents/lib/opus.framework"      || { echo "::error::missing opus.framework"; exit 1; }
          test -d "$APP/Contents/lib/ogg.framework"       || { echo "::error::missing ogg.framework"; exit 1; }
          codesign --verify --deep --strict "$APP"
          echo "store bundle verified"
      # The other half of the contract, and the cheaper mistake to make: a plain build must stay ungated.
      # Shipping THAT to an app store is an automatic rejection — no Restore button exists in it at all.
      - name: A plain build must carry no store flag
        run: |
          ./build_app.sh
          if plutil -extract ParlaStoreBuild xml1 -o - Parla.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "::error::the open-source build is gated — the store flag leaked into a plain build"; exit 1
          fi
          echo "plain build is ungated, as intended"

  ios:
    name: iOS · xcodebuild test (app + extensions)
    # macos-26, not macos-15: the FoundationModels backend is gated on `canImport`, which is FALSE on the
    # iOS 18 SDK — so on the older image the whole Apple-Intelligence path compiled to nothing and CI proved
    # nothing about it. The macOS job already runs here.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: apps/ios
        run: xcodegen generate
      # Pin the iOS dependency graph. It is resolved through the generated project, not through the root
      # package, so without this it resolves fresh from open-ended ranges on every run — and the day WhisperKit
      # tags 0.19, this job silently builds against a different WhisperKit than the macOS jobs from the same
      # commit. Xcode never writes this file for a project set up like ours (verified: only DerivedData's
      # workspace-state.json appears), but it READS it — verified by seeding a different version and watching
      # xcodebuild check that version out. Hence a hand-maintained seed, copied in after every generate because
      # the .xcodeproj is a gitignored build artifact.
      - name: Pin the iOS dependency graph
        working-directory: apps/ios
        run: |
          mkdir -p Parla-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Parla-iOS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      # `test`, not `build`. This job used to only COMPILE, so `Parla-iOSTests` — the share-handoff data-loss
      # guards, the App-Group drain, the in-process Opus/Lane-2 decode proofs — ran in CI NOWHERE. Testing needs a
      # concrete simulator (not `generic/platform=iOS Simulator`), so resolve one from the runner image instead of
      # hardcoding a device name that drifts with the image. Verified locally: 18 tests pass unsigned on the sim.
      # -skipMacroValidation trusts the dependency Swift macros (swift-transformers) non-interactively;
      # CODE_SIGNING_ALLOWED=NO because CI has no provisioning profile (same as the local recipe).
      - name: Test (app + extensions, simulator)
        working-directory: apps/ios
        run: |
          DEST=$(xcrun simctl list devices available \
                 | grep -m1 -E '^ +iPhone' \
                 | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
          [ -n "$DEST" ] || { echo "::error::no available iPhone simulator on this runner"; exit 1; }
          echo "simulator: $DEST"
          xcodebuild test \
            -project Parla-iOS.xcodeproj \
            -scheme Parla-iOS \
            -destination "id=$DEST" \
            -skipMacroValidation \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO
